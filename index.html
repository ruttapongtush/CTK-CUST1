<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTK Customer — ระบบลูกค้า บิล Diagram และประวัติซ่อม</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>CTK Customer System</h1>
      <p class="subtitle">ฐานข้อมูลลูกค้า · บิล/งานติดตั้ง · Diagram (PDF) · ประวัติซ่อมแซม</p>
    </div>
    <button type="button" class="btn btn-secondary" onclick="fetchFromSheet()">รีเฟรชข้อมูล</button>
  </header>

  <!-- ช่องค้นหาหลัก -->
  <section class="search-bar">
    <input
      type="text"
      id="globalSearch"
      placeholder="ค้นหาชื่อลูกค้า, รหัสลูกค้า, เลขที่บิล (เช่น Invoice1234), รุ่นสินค้า, S/N หรือ IP..."
      oninput="renderAll()"
    />
  </section>

  <!-- พื้นที่หลัก: ซ้ายรายชื่อลูกค้า / ขวารายละเอียดลูกค้า + บิล + ซ่อมบำรุง -->
  <main class="layout-grid">
    <aside class="customer-sidebar">
      <div class="sidebar-header">
        <strong>รายชื่อลูกค้า</strong>
        <span id="customerCount" class="pill">0</span>
      </div>
      <div id="customerList" class="customer-list"></div>
    </aside>

    <section id="customerDetailPanel" class="detail-panel">
      <div class="card empty-state">กำลังโหลดข้อมูลจาก Google Sheets...</div>
    </section>
  </main>

  <!-- โมดอลเพิ่ม/แก้ไข Diagram (PDF) -->
  <dialog id="diagramModal" class="modal">
    <form method="dialog" onsubmit="handleSaveDiagram(event)">
      <h3 id="diagModalTitle">เพิ่ม / แก้ไข Diagram (PDF)</h3>
      <input type="hidden" id="diagScope" />
      <input type="hidden" id="diagCustomerId" />
      <input type="hidden" id="diagReceiptNo" />

      <div class="form-group">
        <label>เป้าหมาย</label>
        <input type="text" id="diagTargetLabel" readonly />
      </div>

      <div class="form-group">
        <label>พาธไฟล์ใน Repo (เช่น <code>Diagram/DR.Gift.pdf</code>)</label>
        <input type="text" id="diagPdfUrl" required placeholder="Diagram/DR.Gift.pdf" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeDiagramModal()">ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก Diagram</button>
      </div>
    </form>
  </dialog>

  <!-- โมดอลเปิดดู PDF บนเบราว์เซอร์ -->
  <dialog id="pdfViewerModal" class="modal pdf-modal">
    <div class="pdf-viewer-shell">
      <div class="pdf-viewer-bar">
        <strong id="pdfViewerTitle">Diagram (PDF)</strong>
        <div class="pdf-viewer-actions">
          <a id="pdfExternalLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm">เปิดแท็บใหม่</a>
          <button type="button" class="btn btn-ghost btn-sm" onclick="closePdfViewer()">ปิด</button>
        </div>
      </div>
      <iframe id="pdfIframe" src="" class="pdf-iframe" title="PDF Viewer"></iframe>
    </div>
  </dialog>

  <script src="app.js?v=3"></script>
</body>
</html>
